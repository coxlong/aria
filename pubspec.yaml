name: aria
description: "Aria — an AI action workspace."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  acp:
    path: packages/acp
  material_ui: ^1.8.0
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  go_router: ^18.1.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.0.0
  intl: ^0.20.3
  uuid: ^4.6.0
  flutter_markdown_plus: ^1.0.12
  highlight: ^0.7.0
  markdown: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  build_runner: ^2.9.0
  freezed: ^4.0.3
  json_serializable: ^6.10.0
  riverpod_generator: ^4.0.9
  riverpod_lint: ^3.1.9
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
